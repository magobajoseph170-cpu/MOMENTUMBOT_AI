name: Public export release gate

on:
  push:
    branches: [main]
    paths:
      - 'public_exports/**'
      - 'tools/validate_public_sync.py'
      - 'tests/test_public_sync_validator.py'
      - '.github/workflows/public-export-gate.yml'
  pull_request:
    paths:
      - 'public_exports/**'
      - 'tools/validate_public_sync.py'
      - 'tests/test_public_sync_validator.py'
      - '.github/workflows/public-export-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-public-export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run release-gate regression tests
        run: python -m pip install pytest && python -m pytest -q tests/test_public_sync_validator.py
      - name: Validate approved candidate file names and contents
        run: python tools/validate_public_sync.py
