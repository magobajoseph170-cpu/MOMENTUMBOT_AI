name: Public website and isolated API checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: public_api/requirements.txt
      - name: Install public API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r public_api/requirements.txt pytest httpx
      - name: Test isolated API and public website
        run: python -m pytest -q public_api/tests
